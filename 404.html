<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — CleanDock</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070b14">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #070b14; --text: #eaf0fb; --muted: #95a2ba; --blue: #3d8bff; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
      font: 16px/1.6 "Inter", system-ui, "Segoe UI", sans-serif; color: var(--text);
      background: radial-gradient(600px 380px at 30% 20%, rgba(61,139,255,.28), transparent 70%),
                  radial-gradient(500px 360px at 75% 80%, rgba(167,139,250,.18), transparent 70%), var(--bg);
    }
    img { border-radius: 22px; box-shadow: 0 20px 50px -14px rgba(61,139,255,.7); }
    .code { margin: 26px 0 6px; font: 800 clamp(4rem, 16vw, 7rem)/1 "Plus Jakarta Sans", sans-serif; letter-spacing: -.04em;
      background: linear-gradient(100deg, #7cc4ff 10%, var(--blue) 45%, #a78bfa 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 0; font: 800 1.6rem/1.2 "Plus Jakarta Sans", sans-serif; }
    p { margin: 10px auto 0; max-width: 420px; color: var(--muted); }
    a.btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 26px; padding: .85em 1.5em; border-radius: 999px; font-weight: 600; color: #fff; text-decoration: none;
      background: linear-gradient(135deg, var(--blue), #2563eb); box-shadow: 0 10px 30px -10px rgba(61,139,255,.8), inset 0 1px 0 rgba(255,255,255,.25); }
    a.btn:hover { filter: brightness(1.1); }
    a.btn:focus-visible { outline: 2px solid #5fb4ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/icon-128.png" alt="CleanDock" width="88" height="88">
    <div class="code" aria-hidden="true">404</div>
    <h1>This page isn't on the dock.</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a class="btn" href="/">← Back to CleanDock</a>
  </main>
</body>
</html>
